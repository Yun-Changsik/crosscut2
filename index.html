<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossCut Alignment Tool</title>
<style>
html,body{
    height:100%;
}
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:8px;
    box-sizing:border-box;
    overflow:hidden;
}

/* 기본(세로 화면): 위에 사진, 아래에 패널. 사진은 항상 화면에 고정 */
#app{
    display:flex;
    flex-direction:column;
    height:100%;
    gap:8px;
}
#stage{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}
canvas{
    width:min(100%,42vh);
    width:min(100%,42dvh);
    aspect-ratio:1/1;
    height:auto;
    border:1px solid #666;
    touch-action:none;
    background:#000;
}
#side{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.actions{
    display:flex;
    align-items:center;
    gap:12px;
    background:#222;
    border-radius:10px;
    padding:8px 10px;
    position:sticky;
    top:0;
    z-index:1;
}
button{
    padding:10px 16px;
    font-size:17px;
    flex:none;
}
#result{
    font-size:15px;
    font-weight:bold;
    line-height:1.4;
    text-align:left;
}

.panel{
    margin-top:8px;
    background:#222;
    padding:8px 10px 12px;
    border-radius:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 14px;
    text-align:left;
}
.panel h3{
    grid-column:1 / -1;
    margin:6px 0 0;
    font-size:15px;
}
.panel .wide{
    grid-column:1 / -1;
}
.panel .hint{
    grid-column:1 / -1;
    margin:0;
    font-size:13px;
    color:#aaa;
}
label{
    display:block;
    font-size:13px;
}
input[type=range]{
    width:100%;
    margin:4px 0 0;
}

/* 넓은 화면(가로/PC): 왼쪽에 사진, 오른쪽에 패널 */
@media (min-width:800px) and (orientation:landscape){
    #app{
        flex-direction:row;
    }
    #stage{
        width:min(58vw,calc(100vh - 16px));
        width:min(58vw,calc(100dvh - 16px));
    }
    canvas{
        width:100%;
    }
    #side{
        padding-right:4px;
    }
}
</style>
</head>
<body>

<div id="app">

    <div id="stage">
        <input type="file" id="fileInput" accept="image/*">
        <canvas id="canvas" width="900" height="900"></canvas>
    </div>

    <div id="side">

        <div class="actions">
            <button id="analyzeBtn">분석 시작</button>
            <div id="result">분석 전</div>
        </div>

        <div class="panel">
            <h3>사진 조절</h3>

            <label>사진 확대
                <input id="imgScale" type="range" min="0.05" max="10" step="0.05" value="1">
            </label>
            <label>사진 회전
                <input id="imgRotation" type="range" min="-180" max="180" value="0">
            </label>
            <label>사진 X
                <input id="imgX" type="range" min="-1000" max="1000" value="0">
            </label>
            <label>사진 Y
                <input id="imgY" type="range" min="-1000" max="1000" value="0">
            </label>

            <h3>Grid 조절</h3>

            <label>Grid 크기
                <input id="gridSize" type="range" min="50" max="800" value="250">
            </label>
            <label>Grid 회전
                <input id="gridRotation" type="range" min="-180" max="180" value="0">
            </label>
            <p class="hint">Grid는 사진 위를 손가락(또는 마우스)으로 드래그</p>

            <h3>분석 기준</h3>

            <label class="wide">밝기 기준 (이보다 밝으면 박리): <span id="thrVal">170</span>
                <input id="threshold" type="range" min="50" max="250" value="170">
            </label>
            <label class="wide">
                <input id="previewToggle" type="checkbox">
                밝기 미리보기 항상 켜기 (슬라이더를 움직이는 동안은 자동으로 켜져요)
            </label>
        </div>

    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const imgScale = document.getElementById("imgScale");
const imgRotation = document.getElementById("imgRotation");
const imgX = document.getElementById("imgX");
const imgY = document.getElementById("imgY");
const gridSize = document.getElementById("gridSize");
const gridRotation = document.getElementById("gridRotation");
const threshold = document.getElementById("threshold");
const thrVal = document.getElementById("thrVal");
const resultEl = document.getElementById("result");
const previewToggle = document.getElementById("previewToggle");

let previewHold = false;   // 밝기 슬라이더를 누르고 있는 동안 true

let image = null;
let gridCenterX = 450;
let gridCenterY = 450;

// 분석 결과 셀 (null이면 오버레이 없음)
let overlayCells = null;

/* ---------- 이미지 불러오기 ---------- */

document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
        image = img;
        overlayCells = null;
        resultEl.textContent = "분석 전";
        draw();
        URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
});

/* ---------- 슬라이더 ---------- */

[imgScale, imgRotation, imgX, imgY, gridSize, gridRotation].forEach(el => {
    el.addEventListener("input", () => {
        overlayCells = null;   // 조정하면 이전 분석 결과는 무효
        draw();
    });
});

threshold.addEventListener("input", () => {
    thrVal.textContent = threshold.value;
    previewHold = true;
    overlayCells = null;
    draw();
});

function endPreviewHold() {
    if (!previewHold) return;
    previewHold = false;
    draw();
}
["pointerup", "pointercancel", "change", "touchend", "touchcancel", "blur"].forEach(type => {
    threshold.addEventListener(type, endPreviewHold);
});

previewToggle.addEventListener("change", draw);

/* ---------- 그리기 ---------- */

function drawImageOnly() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!image) return;

    const scale = parseFloat(imgScale.value);
    const angle = parseFloat(imgRotation.value) * Math.PI / 180;
    const w = image.width * scale;
    const h = image.height * scale;

    ctx.save();
    ctx.translate(
        canvas.width / 2 + parseInt(imgX.value),
        canvas.height / 2 + parseInt(imgY.value)
    );
    ctx.rotate(angle);
    ctx.drawImage(image, -w / 2, -h / 2, w, h);
    ctx.restore();
}

function drawGrid() {
    const size = parseInt(gridSize.value);
    const cell = size / 5;
    const angle = parseFloat(gridRotation.value) * Math.PI / 180;

    ctx.save();
    ctx.translate(gridCenterX, gridCenterY);
    ctx.rotate(angle);

    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 2;
    for (let i = 0; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(-size / 2 + cell * i, -size / 2);
        ctx.lineTo(-size / 2 + cell * i, size / 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-size / 2, -size / 2 + cell * i);
        ctx.lineTo(size / 2, -size / 2 + cell * i);
        ctx.stroke();
    }

    ctx.strokeStyle = "lime";
    ctx.lineWidth = 4;
    ctx.strokeRect(-size / 2, -size / 2, size, size);

    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-20, 0);
    ctx.lineTo(20, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(0, 20);
    ctx.stroke();

    ctx.restore();
}

function drawOverlay() {
    if (!overlayCells) return;

    const size = parseInt(gridSize.value);
    const cellSize = size / 5;
    const angle = parseFloat(gridRotation.value) * Math.PI / 180;

    ctx.save();
    ctx.translate(gridCenterX, gridCenterY);
    ctx.rotate(angle);

    overlayCells.forEach(c => {
        ctx.fillStyle = c.failed
            ? "rgba(255,0,0,0.45)"
            : "rgba(0,255,0,0.25)";
        ctx.fillRect(c.localX, c.localY, cellSize, cellSize);
    });

    ctx.restore();
}

// 기준값보다 밝은 픽셀을 마젠타색으로 표시 (분석에는 영향 없음, 화면 표시용)
function drawThresholdPreview() {
    if (!image) return;
    let frame;
    try {
        frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    } catch (err) {
        return;
    }
    const d = frame.data;
    const thr = parseFloat(threshold.value);
    for (let i = 0; i < d.length; i += 4) {
        const gray = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (gray > thr && d[i + 3] > 0) {
            d[i] = 255;
            d[i + 1] = 0;
            d[i + 2] = 200;
        }
    }
    ctx.putImageData(frame, 0, 0);
}

function draw() {
    drawImageOnly();
    if (previewHold || previewToggle.checked) drawThresholdPreview();
    drawOverlay();
    drawGrid();
}

/* ---------- 분석 ---------- */

function gradeFromLoss(loss) {
    // ASTM D3359 (Method B) 박리 면적 기준
    if (loss <= 0.5) return "5B";   // 0%
    if (loss < 5)    return "4B";   // 5% 미만
    if (loss < 15)   return "3B";   // 5 ~ 15%
    if (loss < 35)   return "2B";   // 15 ~ 35%
    if (loss < 65)   return "1B";   // 35 ~ 65%
    return "0B";                    // 65% 초과
}

function analyzeCrossCut() {
    if (!image) {
        resultEl.textContent = "먼저 사진을 올려주세요";
        return;
    }

    // 격자선/오버레이 없이 사진만 그린 상태에서 픽셀을 읽는다
    drawImageOnly();

    const size = parseFloat(gridSize.value);
    const cellSize = size / 5;
    const angle = parseFloat(gridRotation.value) * Math.PI / 180;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);
    const thr = parseFloat(threshold.value);
    const inspectSize = Math.max(Math.round(cellSize * 0.4), 10);

    const cells = [];
    let failedCells = 0;
    let totalLoss = 0;

    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
            const localX = -size / 2 + col * cellSize;
            const localY = -size / 2 + row * cellSize;
            const cx = localX + cellSize / 2;
            const cy = localY + cellSize / 2;

            const worldX = gridCenterX + cx * cosA - cy * sinA;
            const worldY = gridCenterY + cx * sinA + cy * cosA;

            // 캔버스 밖으로 나가는 영역은 잘라냄
            let x0 = Math.round(worldX - inspectSize / 2);
            let y0 = Math.round(worldY - inspectSize / 2);
            let x1 = x0 + inspectSize;
            let y1 = y0 + inspectSize;
            x0 = Math.max(0, x0);
            y0 = Math.max(0, y0);
            x1 = Math.min(canvas.width, x1);
            y1 = Math.min(canvas.height, y1);

            if (x1 <= x0 || y1 <= y0) {
                cells.push({ localX, localY, failed: false });
                continue;
            }

            let data;
            try {
                data = ctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;
            } catch (err) {
                cells.push({ localX, localY, failed: false });
                continue;
            }

            let bright = 0;
            const pixels = data.length / 4;
            for (let i = 0; i < data.length; i += 4) {
                const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
                if (gray > thr) bright++;
            }

            const loss = (bright / pixels) * 100;
            totalLoss += loss;

            const failed = loss > 20;
            if (failed) failedCells++;
            cells.push({ localX, localY, failed });
        }
    }

    const averageLoss = totalLoss / 25;
    const retention = 100 - averageLoss;
    const astm = gradeFromLoss(averageLoss);

    overlayCells = cells;
    draw();

    resultEl.innerHTML =
        `ASTM : <b>${astm}</b><br>` +
        `Retention : ${retention.toFixed(1)} %<br>` +
        `Loss : ${averageLoss.toFixed(1)} %<br>` +
        `Failed Cells : ${failedCells} / 25`;
}

document.getElementById("analyzeBtn").addEventListener("click", analyzeCrossCut);

/* ---------- Grid 드래그 (마우스/터치 공통) ---------- */

let dragging = false;

function moveGridTo(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    gridCenterX = (clientX - rect.left) * canvas.width / rect.width;
    gridCenterY = (clientY - rect.top) * canvas.height / rect.height;
    overlayCells = null;
    draw();
}

canvas.addEventListener("pointerdown", e => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    moveGridTo(e.clientX, e.clientY);
});

canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    moveGridTo(e.clientX, e.clientY);
});

["pointerup", "pointercancel"].forEach(type => {
    canvas.addEventListener(type, () => { dragging = false; });
});

draw();
</script>

</body>
</html>
