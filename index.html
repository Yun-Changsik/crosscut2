<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CrossCut Analyzer</title>

<script async
src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    background:#111;
    color:white;
}

canvas{
    max-width:90%;
    border:1px solid #666;
}

#result{
    margin-top:20px;
    font-size:20px;
}

input{
    margin:20px;
}

</style>
</head>
<body>

<h2>CrossCut Analyzer</h2>

<input type="file" id="fileInput" accept="image/*">

<br>

<canvas id="canvas"></canvas>

<div id="result">
이미지를 선택하세요
</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const resultDiv =
document.getElementById("result");

let cvReady=false;

cv['onRuntimeInitialized']=()=>{

    cvReady=true;

    resultDiv.innerHTML=
    "OpenCV Ready";
};

document
.getElementById("fileInput")
.addEventListener("change",(e)=>{

    if(!cvReady){

        alert("OpenCV 로딩중");

        return;
    }

    const file=e.target.files[0];

    if(!file)return;

    const img=new Image();

    img.onload=()=>{

        canvas.width=img.width;
        canvas.height=img.height;

        ctx.drawImage(
            img,
            0,
            0
        );

        analyze();

    };

    img.src=
      URL.createObjectURL(file);

});

function clusterLines(lines){

    lines.sort((a,b)=>a-b);

    const out=[];

    lines.forEach(v=>{

        if(
          out.length===0 ||
          Math.abs(
             v-out[out.length-1]
          )>15
        ){
            out.push(v);
        }

    });

    return out;

}

function findBest6(lines){

    if(lines.length<=6){

        return lines;

    }

    const step=
      (lines.length-1)/5;

    let out=[];

    for(let i=0;i<6;i++){

        out.push(
          Math.round(
           lines[
             Math.round(i*step)
           ]
          )
        );

    }

    return out;

}

function analyze(){

    let src=cv.imread(canvas);

    let gray=new cv.Mat();

    cv.cvtColor(
       src,
       gray,
       cv.COLOR_RGBA2GRAY
    );

    let binary=new cv.Mat();

    cv.threshold(
      gray,
      binary,
      0,
      255,
      cv.THRESH_OTSU
    );

    let lines=new cv.Mat();

    cv.HoughLinesP(
      binary,
      lines,
      1,
      Math.PI/180,
      30,
      30,
      10
    );

    let vertical=[];
    let horizontal=[];

    for(let i=0;i<lines.rows;i++){

        let idx=i*4;

        let x1=
          lines.data32S[idx];

        let y1=
          lines.data32S[idx+1];

        let x2=
          lines.data32S[idx+2];

        let y2=
          lines.data32S[idx+3];

        let dx=
          Math.abs(x2-x1);

        let dy=
          Math.abs(y2-y1);

        if(dx<10 && dy>20){

            vertical.push(
              (x1+x2)/2
            );
        }

        if(dy<10 && dx>20){

            horizontal.push(
              (y1+y2)/2
            );
        }
    }

    vertical=
      clusterLines(vertical);

    horizontal=
      clusterLines(horizontal);

    vertical=
      findBest6(vertical);

    horizontal=
      findBest6(horizontal);

    if(
       vertical.length<6 ||
       horizontal.length<6
    ){

        resultDiv.innerHTML=
        "격자 검출 실패";

        return;
    }

    ctx.lineWidth=2;

    ctx.strokeStyle="lime";

    vertical.forEach(x=>{

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
          x,
          canvas.height
        );

        ctx.stroke();
    });

    horizontal.forEach(y=>{

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
          canvas.width,
          y
        );

        ctx.stroke();
    });

    let totalLoss=0;
    let cells=0;

    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            let x1=
              vertical[c];

            let x2=
              vertical[c+1];

            let y1=
              horizontal[r];

            let y2=
              horizontal[r+1];

            let mx=5;

            let my=5;

            let w=
             (x2-x1)-mx*2;

            let h=
             (y2-y1)-my*2;

            if(
              w<5 ||
              h<5
            ){

                continue;
            }

            let roi=
             ctx.getImageData(
               x1+mx,
               y1+my,
               w,
               h
             );

            let bright=0;

            let pixels=
              roi.data.length/4;

            for(
              let i=0;
              i<roi.data.length;
              i+=4
            ){

                let g=
                 (
                   roi.data[i]+
                   roi.data[i+1]+
                   roi.data[i+2]
                 )/3;

                if(g>180){

                    bright++;
                }
            }

            let loss=
              bright/pixels;

            totalLoss+=loss;

            cells++;

            ctx.fillStyle=
             loss>0.25
             ? "rgba(255,0,0,0.35)"
             : "rgba(0,255,0,0.2)";

            ctx.fillRect(
               x1,
               y1,
               x2-x1,
               y2-y1
            );
        }
    }

    let avgLoss=
      (totalLoss/cells)*100;

    let astm="5B";

    if(avgLoss>5) astm="4B";
    if(avgLoss>15) astm="3B";
    if(avgLoss>35) astm="2B";
    if(avgLoss>65) astm="1B";
    if(avgLoss>90) astm="0B";

    resultDiv.innerHTML=
    `
    ASTM : ${astm}<br>
    박리율 : ${avgLoss.toFixed(1)} %<br>
    Cells : ${cells}
    `;

    src.delete();
    gray.delete();
    binary.delete();
    lines.delete();
}

</script>

</body>
</html>
