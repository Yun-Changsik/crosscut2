<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>CrossCut Alignment Tool</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:10px;
    text-align:center;
}

canvas{
    width:95vw;
    max-width:900px;
    border:1px solid #666;
    touch-action:none;
    background:#000;
}

.panel{

    width:95vw;
    max-width:900px;

    margin:auto;
    margin-top:10px;

    background:#222;
    padding:10px;

    border-radius:10px;
}

label{
    display:block;
    margin-top:10px;
}

input[type=range]{
    width:90%;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:18px;
}

</style>
</head>
<body>

<h2>CrossCut Alignment Tool</h2>

<input
type="file"
id="fileInput"
accept="image/*">

<br><br>

<canvas
id="canvas"
width="900"
height="900">
</canvas>

<div class="panel">

<h3>사진 조절</h3>

<label>
사진 확대
<input
id="imgScale"
type="range"
min="0.2"
max="10"
step="0.05"
value="1">
</label>

<label>
사진 회전
<input
id="imgRotation"
type="range"
min="-180"
max="180"
value="0">
</label>

<label>
사진 X
<input
id="imgX"
type="range"
min="-1000"
max="1000"
value="0">
</label>

<label>
사진 Y
<input
id="imgY"
type="range"
min="-1000"
max="1000"
value="0">
</label>

<hr>

<h3>Grid 조절</h3>

<label>
Grid 크기
<input
id="gridSize"
type="range"
min="50"
max="800"
value="250">
</label>

<label>
Grid 회전
<input
id="gridRotation"
type="range"
min="-180"
max="180"
value="0">
</label>

<p>
Grid는 손가락으로 드래그
</p>

</div>
<button id="analyzeBtn">
분석 시작
</button>

<div id="result"
style="
margin-top:20px;
font-size:22px;
font-weight:bold;
color:white;
">
분석 전
</div>
<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let image = null;

const imgScale =
document.getElementById("imgScale");

const imgRotation =
document.getElementById("imgRotation");

const imgX =
document.getElementById("imgX");

const imgY =
document.getElementById("imgY");

const gridSize =
document.getElementById("gridSize");

const gridRotation =
document.getElementById("gridRotation");


let gridCenterX =
450;

let gridCenterY =
450;

document
.getElementById("fileInput")
.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file) return;

const img =
new Image();

img.onload=()=>{

image=img;
document
.getElementById("analyzeBtn")
.addEventListener(
    "click",
    analyzeCrossCut
);

function analyzeCrossCut(){

    draw();

    const size =
    parseFloat(gridSize.value);

    const cellSize =
    size / 5;

    const angle =
    parseFloat(gridRotation.value)
    *
    Math.PI
    /
    180;

    let failedCells = 0;
    let totalLoss = 0;

    for(let row=0; row<5; row++){

        for(let col=0; col<5; col++){

            const localX =
            -size/2 +
            col*cellSize;

            const localY =
            -size/2 +
            row*cellSize;

            const centerX =
            localX +
            cellSize/2;

            const centerY =
            localY +
            cellSize/2;

            const worldX =
            gridCenterX +
            (
              centerX *
              Math.cos(angle)
            ) -
            (
              centerY *
              Math.sin(angle)
            );

            const worldY =
            gridCenterY +
            (
              centerX *
              Math.sin(angle)
            ) +
            (
              centerY *
              Math.cos(angle)
            );

            const inspectSize =
            Math.max(
              cellSize * 0.4,
              10
            );

            let imageData;

            try{

                imageData =
                ctx.getImageData(

                    worldX -
                    inspectSize/2,

                    worldY -
                    inspectSize/2,

                    inspectSize,

                    inspectSize

                );

            }
            catch{

                continue;

            }

            let brightPixels = 0;

            const pixels =
            imageData.data.length / 4;

            for(
                let i=0;
                i<imageData.data.length;
                i+=4
            ){

                const gray =
                (
                    imageData.data[i]
                    +
                    imageData.data[i+1]
                    +
                    imageData.data[i+2]
                ) / 3;

                if(gray > 170){

                    brightPixels++;

                }
            }

            const loss =
            (
              brightPixels /
              pixels
            ) * 100;

            totalLoss += loss;

            if(loss > 20){

                failedCells++;

                paintCell(
                    localX,
                    localY,
                    cellSize,
                    angle,
                    "rgba(255,0,0,0.45)"
                );

            }
            else{

                paintCell(
                    localX,
                    localY,
                    cellSize,
                    angle,
                    "rgba(0,255,0,0.25)"
                );

            }
        }
    }

    const averageLoss =
    totalLoss / 25;

    const retention =
    100 - averageLoss;

    let astm="0B";

    if(retention >= 95) astm="5B";
    else if(retention >= 85) astm="4B";
    else if(retention >= 65) astm="3B";
    else if(retention >= 35) astm="2B";
    else if(retention >= 10) astm="1B";

    document
    .getElementById("result")
    .innerHTML =

    `
    ASTM : <b>${astm}</b>

    <br><br>

    Retention :
    ${retention.toFixed(1)} %

    <br><br>

    Loss :
    ${averageLoss.toFixed(1)} %

    <br><br>

    Failed Cells :
    ${failedCells} / 25
    `;
}

function paintCell(
    localX,
    localY,
    cellSize,
    angle,
    color
){

    ctx.save();

    ctx.translate(
        gridCenterX,
        gridCenterY
    );

    ctx.rotate(angle);

    ctx.fillStyle =
    color;

    ctx.fillRect(
        localX,
        localY,
        cellSize,
        cellSize
    );

    ctx.restore();
}
draw();

};

img.src=
URL.createObjectURL(file);

}
);

[
imgScale,
imgRotation,
imgX,
imgY,
gridSize,
gridRotation

].forEach(x=>{

x.addEventListener(
"input",
draw
);

});

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawImage();

drawGrid();

}

function drawImage(){

if(!image) return;

const scale =
parseFloat(
imgScale.value
);

const angle =
parseFloat(
imgRotation.value
)
*
Math.PI
/
180;

const w =
image.width*scale;

const h =
image.height*scale;

ctx.save();

ctx.translate(

canvas.width/2
+
parseInt(imgX.value),

canvas.height/2
+
parseInt(imgY.value)

);

ctx.rotate(angle);

ctx.drawImage(

image,

-w/2,

-h/2,

w,

h

);

ctx.restore();

}

function drawGrid(){

const size =
parseInt(
gridSize.value
);

const cell =
size/5;

const angle =
parseFloat(
gridRotation.value
)
*
Math.PI
/
180;

ctx.save();

ctx.translate(
gridCenterX,
gridCenterY
);

ctx.rotate(angle);

ctx.strokeStyle=
"cyan";

ctx.lineWidth=2;

for(let i=0;i<=5;i++){

ctx.beginPath();

ctx.moveTo(
-size/2 + cell*i,
-size/2
);

ctx.lineTo(
-size/2 + cell*i,
size/2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
-size/2,
-size/2 + cell*i
);

ctx.lineTo(
size/2,
-size/2 + cell*i
);

ctx.stroke();

}

ctx.strokeStyle=
"lime";

ctx.lineWidth=4;

ctx.strokeRect(
-size/2,
-size/2,
size,
size
);

ctx.strokeStyle=
"yellow";

ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(
-20,
0
);
ctx.lineTo(
20,
0
);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(
0,
-20
);
ctx.lineTo(
0,
20
);
ctx.stroke();

ctx.restore();

}

let dragging=false;

canvas.addEventListener(
"touchstart",
e=>{

dragging=true;

}
);

canvas.addEventListener(
"touchend",
e=>{

dragging=false;

}
);

canvas.addEventListener(
"touchmove",
e=>{

if(!dragging) return;

e.preventDefault();

const rect =
canvas.getBoundingClientRect();

const touch =
e.touches[0];

gridCenterX =
(
touch.clientX
-
rect.left
)
*
canvas.width
/
rect.width;

gridCenterY =
(
touch.clientY
-
rect.top
)
*
canvas.height
/
rect.height;

draw();

});

canvas.addEventListener(
"mousedown",
()=>{

dragging=true;

}
);

canvas.addEventListener(
"mouseup",
()=>{

dragging=false;

}
);

canvas.addEventListener(
"mousemove",
e=>{

if(!dragging) return;

const rect =
canvas.getBoundingClientRect();

gridCenterX =
(
e.clientX
-
rect.left
)
*
canvas.width
/
rect.width;

gridCenterY =
(
e.clientY
-
rect.top
)
*
canvas.height
/
rect.height;

draw();

});

draw();

</script>

</body>
</html>
