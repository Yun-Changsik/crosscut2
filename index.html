<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CrossCut Align Tool</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

canvas{
    border:1px solid #666;
    width:95%;
    max-width:800px;
}

.panel{
    margin:10px;
}

label{
    display:block;
    margin:8px;
}

input[type=range]{
    width:250px;
}

</style>
</head>
<body>

<h2>CrossCut Alignment Tool</h2>

<input type="file" id="fileInput" accept="image/*">

<br><br>

<canvas id="canvas" width="800" height="800"></canvas>

<div class="panel">

<label>
사진 확대
<input id="imgScale"
type="range"
min="0.5"
max="5"
step="0.1"
value="1">
</label>

<label>
사진 X
<input id="imgX"
type="range"
min="-500"
max="500"
value="0">
</label>

<label>
사진 Y
<input id="imgY"
type="range"
min="-500"
max="500"
value="0">
</label>

<hr>

<label>
Grid 크기
<input id="gridSize"
type="range"
min="50"
max="500"
value="200">
</label>

<label>
Grid X
<input id="gridX"
type="range"
min="0"
max="800"
value="300">
</label>

<label>
Grid Y
<input id="gridY"
type="range"
min="0"
max="800"
value="300">
</label>

</div>

<button onclick="analyze()">
분석 시작
</button>

<div id="result"></div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let image = null;

const imgScale =
document.getElementById("imgScale");

const imgX =
document.getElementById("imgX");

const imgY =
document.getElementById("imgY");

const gridSize =
document.getElementById("gridSize");

const gridX =
document.getElementById("gridX");

const gridY =
document.getElementById("gridY");

document
.getElementById("fileInput")
.addEventListener("change",e=>{

    const file =
    e.target.files[0];

    const img =
    new Image();

    img.onload=()=>{

        image=img;

        draw();
    };

    img.src =
    URL.createObjectURL(file);

});

[
imgScale,
imgX,
imgY,
gridSize,
gridX,
gridY
].forEach(input=>{

    input.addEventListener(
      "input",
      draw
    );

});

function draw(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    if(image){

        const scale =
        parseFloat(
          imgScale.value
        );

        const w =
        image.width*scale;

        const h =
        image.height*scale;

        ctx.drawImage(

            image,

            parseInt(
              imgX.value
            ),

            parseInt(
              imgY.value
            ),

            w,
            h
        );
    }

    drawGrid();
}

function drawGrid(){

    const x=
    parseInt(
      gridX.value
    );

    const y=
    parseInt(
      gridY.value
    );

    const size=
    parseInt(
      gridSize.value
    );

    const cell=
    size/5;

    ctx.strokeStyle=
      "cyan";

    ctx.lineWidth=
      2;

    for(let i=0;i<=5;i++){

        ctx.beginPath();
        ctx.moveTo(
          x+i*cell,
          y
        );
        ctx.lineTo(
          x+i*cell,
          y+size
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          x,
          y+i*cell
        );
        ctx.lineTo(
          x+size,
          y+i*cell
        );
        ctx.stroke();
    }

    ctx.strokeStyle=
      "lime";

    ctx.lineWidth=
      4;

    ctx.strokeRect(
      x,
      y,
      size,
      size
    );
}

function analyze(){

    const roiX =
    parseInt(
      gridX.value
    );

    const roiY =
    parseInt(
      gridY.value
    );

    const size =
    parseInt(
      gridSize.value
    );

    let totalLoss=0;

    for(let row=0;row<5;row++){

        for(let col=0;col<5;col++){

            const cellSize=
            size/5;

            const data=
            ctx.getImageData(

              roiX+col*cellSize+5,

              roiY+row*cellSize+5,

              cellSize-10,

              cellSize-10

            );

            let bright=0;

            const pixels=
              data.data.length/4;

            for(
              let i=0;
              i<data.data.length;
              i+=4
            ){

                const gray=
                (
                  data.data[i]+
                  data.data[i+1]+
                  data.data[i+2]
                )/3;

                if(gray>180){

                    bright++;
                }
            }

            totalLoss +=
            (bright/pixels)*100;
        }
    }

    const loss=
    totalLoss/25;

    document
    .getElementById(
      "result"
    ).innerHTML=
    `
    Grid 정렬 완료<br>
    평균 밝기율 :
    ${loss.toFixed(1)} %
    `;
}

draw();

</script>

</body>
</html>
