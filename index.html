<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CrossCut Analyzer</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

h1{
    font-size:42px;
}

input{
    margin:20px;
}

canvas{
    max-width:95%;
    border:1px solid #666;
    margin-top:15px;
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:22px;
}

</style>
</head>
<body>

<h1>CrossCut Analyzer</h1>

<input
type="file"
id="fileInput"
accept="image/*">

<br>

<canvas id="canvas"></canvas>

<br>

<button id="analyzeBtn">
분석하기
</button>

<div id="result">
이미지를 선택하세요
</div>

<script>

const fileInput =
document.getElementById("fileInput");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const analyzeBtn =
document.getElementById("analyzeBtn");

const result =
document.getElementById("result");

let imageLoaded = false;

fileInput.addEventListener(
"change",
(event)=>{

    const file =
    event.target.files[0];

    if(!file) return;

    const img =
    new Image();

    img.onload=()=>{

        canvas.width =
        img.width;

        canvas.height =
        img.height;

        ctx.drawImage(
            img,
            0,
            0
        );

        imageLoaded=true;

        result.innerHTML=
        "이미지 로드 성공";
    };

    img.src=
    URL.createObjectURL(file);

});

analyzeBtn.addEventListener(
"click",
()=>{

    if(!imageLoaded){

        alert(
        "먼저 이미지를 선택하세요"
        );

        return;
    }

    analyzeImage();
});

function analyzeImage(){

    const imageData =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const data =
    imageData.data;

    let brightPixels=0;

    let totalPixels=
    data.length/4;

    for(
        let i=0;
        i<data.length;
        i+=4
    ){

        const gray =
        (
          data[i] +
          data[i+1] +
          data[i+2]
        ) / 3;

        if(gray > 180){

            brightPixels++;
        }
    }

    const delamination =
    (brightPixels/totalPixels)
    *100;

    let ASTM="5B";

    if(delamination > 5)
        ASTM="4B";

    if(delamination >15)
        ASTM="3B";

    if(delamination >35)
        ASTM="2B";

    if(delamination >65)
        ASTM="1B";

    if(delamination >90)
        ASTM="0B";

    result.innerHTML=
    `
    ASTM 추정 : <b>${ASTM}</b><br>
    밝은영역 비율 : ${delamination.toFixed(1)} %<br>
    (현재는 테스트 버전)
    `;
}

</script>

</body>
</html>
