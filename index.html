<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CrossCut Analyzer V3</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

h1{
    font-size:42px;
}

input{
    margin:20px;
}

canvas{
    max-width:95%;
    border:1px solid #666;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:22px;
    line-height:1.6;
}

</style>
</head>

<body>

<h1>CrossCut Analyzer</h1>

<input
type="file"
id="fileInput"
accept="image/*">

<br>

<canvas id="canvas"></canvas>

<br>

<button id="analyzeBtn">
ROI + Grid 분석
</button>

<div id="result">
이미지를 선택하세요
</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");

const fileInput =
document.getElementById("fileInput");

const analyzeBtn =
document.getElementById("analyzeBtn");

let imageLoaded = false;

fileInput.addEventListener(
"change",
(event)=>{

    const file =
    event.target.files[0];

    if(!file) return;

    const img =
    new Image();

    img.onload = ()=>{

        canvas.width =
        img.width;

        canvas.height =
        img.height;

        ctx.drawImage(
            img,
            0,
            0
        );

        imageLoaded=true;

        result.innerHTML =
        "이미지 로드 완료";
    };

    img.src =
    URL.createObjectURL(file);

});

analyzeBtn.addEventListener(
"click",
()=>{

    if(!imageLoaded){

        alert(
        "이미지를 먼저 선택하세요"
        );

        return;
    }

    detectROI();

});

function detectROI(){

    const imageData =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const data =
    imageData.data;

    let minX = 999999;
    let minY = 999999;

    let maxX = 0;
    let maxY = 0;

    let darkPixels = 0;

    for(
        let y=0;
        y<canvas.height;
        y+=2
    ){

        for(
            let x=0;
            x<canvas.width;
            x+=2
        ){

            const idx =
            (
              y*canvas.width+x
            )*4;

            const gray =
            (
              data[idx] +
              data[idx+1] +
              data[idx+2]
            )/3;

            if(gray < 100){

                darkPixels++;

                if(x<minX) minX=x;
                if(y<minY) minY=y;

                if(x>maxX) maxX=x;
                if(y>maxY) maxY=y;
            }
        }
    }

    if(darkPixels < 500){

        result.innerHTML =
        "ROI 검출 실패";

        return;
    }

    const padding = 20;

    minX =
    Math.max(
      minX-padding,
      0
    );

    minY =
    Math.max(
      minY-padding,
      0
    );

    maxX =
    Math.min(
      maxX+padding,
      canvas.width
    );

    maxY =
    Math.min(
      maxY+padding,
      canvas.height
    );

    ctx.lineWidth = 6;
    ctx.strokeStyle = "lime";

    ctx.strokeRect(
      minX,
      minY,
      maxX-minX,
      maxY-minY
    );

    drawGrid(
      minX,
      minY,
      maxX,
      maxY
    );
}

function drawGrid(
    minX,
    minY,
    maxX,
    maxY
){

    const roiWidth =
      maxX-minX;

    const roiHeight =
      maxY-minY;

    const cellW =
      roiWidth/5;

    const cellH =
      roiHeight/5;

    let totalLoss = 0;
    let totalCells = 0;

    ctx.lineWidth = 2;
    ctx.strokeStyle = "cyan";

    for(let row=0;row<5;row++){

        for(let col=0;col<5;col++){

            const x =
              minX +
              col*cellW;

            const y =
              minY +
              row*cellH;

            const loss =
            analyzeCell(
              x,
              y,
              cellW,
              cellH
            );

            totalLoss += loss;
            totalCells++;

            if(loss > 20){

                ctx.fillStyle =
                "rgba(255,0,0,0.35)";

            }
            else{

                ctx.fillStyle =
                "rgba(0,255,0,0.15)";
            }

            ctx.fillRect(
              x,
              y,
              cellW,
              cellH
            );

            ctx.strokeRect(
              x,
              y,
              cellW,
              cellH
            );
        }
    }

    const avgLoss =
      totalLoss /
      totalCells;

    let astm = "5B";

    if(avgLoss > 5)
      astm = "4B";

    if(avgLoss > 15)
      astm = "3B";

    if(avgLoss > 35)
      astm = "2B";

    if(avgLoss > 65)
      astm = "1B";

    if(avgLoss > 90)
      astm = "0B";

    result.innerHTML =
    `
    <b>ROI 검출 완료</b><br><br>

    ASTM 추정 :
    <b>${astm}</b><br>

    평균 박리율 :
    ${avgLoss.toFixed(1)} %<br>

    Grid :
    5 × 5 Cells
    `;
}

function analyzeCell(
    x,
    y,
    w,
    h
){

    const margin = 5;

    const roi =
    ctx.getImageData(

      x + margin,
      y + margin,

      w - margin*2,
      h - margin*2

    );

    let bright = 0;

    const pixels =
    roi.data.length/4;

    for(
        let i=0;
        i<roi.data.length;
        i+=4
    ){

        const gray =
        (
          roi.data[i] +
          roi.data[i+1] +
          roi.data[i+2]
        )/3;

        if(gray > 180){

            bright++;
        }
    }

    return (
      bright / pixels
    ) * 100;
}

</script>

</body>
</html>
