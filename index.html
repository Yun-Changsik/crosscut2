<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>CrossCut Alignment Tool</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:10px;
    text-align:center;
}

canvas{
    width:95vw;
    max-width:900px;
    border:1px solid #666;
    touch-action:none;
    background:#000;
}

.panel{

    width:95vw;
    max-width:900px;

    margin:auto;
    margin-top:10px;

    background:#222;
    padding:10px;

    border-radius:10px;
}

label{
    display:block;
    margin-top:10px;
}

input[type=range]{
    width:90%;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:18px;
}

</style>
</head>
<body>

<h2>CrossCut Alignment Tool</h2>

<input
type="file"
id="fileInput"
accept="image/*">

<br><br>

<canvas
id="canvas"
width="900"
height="900">
</canvas>

<div class="panel">

<h3>사진 조절</h3>

<label>
사진 확대
<input
id="imgScale"
type="range"
min="0.2"
max="10"
step="0.05"
value="1">
</label>

<label>
사진 회전
<input
id="imgRotation"
type="range"
min="-180"
max="180"
value="0">
</label>

<label>
사진 X
<input
id="imgX"
type="range"
min="-1000"
max="1000"
value="0">
</label>

<label>
사진 Y
<input
id="imgY"
type="range"
min="-1000"
max="1000"
value="0">
</label>

<hr>

<h3>Grid 조절</h3>

<label>
Grid 크기
<input
id="gridSize"
type="range"
min="50"
max="800"
value="250">
</label>

<label>
Grid 회전
<input
id="gridRotation"
type="range"
min="-180"
max="180"
value="0">
</label>

<p>
Grid는 손가락으로 드래그
</p>

</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let image = null;

const imgScale =
document.getElementById("imgScale");

const imgRotation =
document.getElementById("imgRotation");

const imgX =
document.getElementById("imgX");

const imgY =
document.getElementById("imgY");

const gridSize =
document.getElementById("gridSize");

const gridRotation =
document.getElementById("gridRotation");


let gridCenterX =
450;

let gridCenterY =
450;

document
.getElementById("fileInput")
.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file) return;

const img =
new Image();

img.onload=()=>{

image=img;

draw();

};

img.src=
URL.createObjectURL(file);

}
);

[
imgScale,
imgRotation,
imgX,
imgY,
gridSize,
gridRotation

].forEach(x=>{

x.addEventListener(
"input",
draw
);

});

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawImage();

drawGrid();

}

function drawImage(){

if(!image) return;

const scale =
parseFloat(
imgScale.value
);

const angle =
parseFloat(
imgRotation.value
)
*
Math.PI
/
180;

const w =
image.width*scale;

const h =
image.height*scale;

ctx.save();

ctx.translate(

canvas.width/2
+
parseInt(imgX.value),

canvas.height/2
+
parseInt(imgY.value)

);

ctx.rotate(angle);

ctx.drawImage(

image,

-w/2,

-h/2,

w,

h

);

ctx.restore();

}

function drawGrid(){

const size =
parseInt(
gridSize.value
);

const cell =
size/5;

const angle =
parseFloat(
gridRotation.value
)
*
Math.PI
/
180;

ctx.save();

ctx.translate(
gridCenterX,
gridCenterY
);

ctx.rotate(angle);

ctx.strokeStyle=
"cyan";

ctx.lineWidth=2;

for(let i=0;i<=5;i++){

ctx.beginPath();

ctx.moveTo(
-size/2 + cell*i,
-size/2
);

ctx.lineTo(
-size/2 + cell*i,
size/2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
-size/2,
-size/2 + cell*i
);

ctx.lineTo(
size/2,
-size/2 + cell*i
);

ctx.stroke();

}

ctx.strokeStyle=
"lime";

ctx.lineWidth=4;

ctx.strokeRect(
-size/2,
-size/2,
size,
size
);

ctx.strokeStyle=
"yellow";

ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(
-20,
0
);
ctx.lineTo(
20,
0
);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(
0,
-20
);
ctx.lineTo(
0,
20
);
ctx.stroke();

ctx.restore();

}

let dragging=false;

canvas.addEventListener(
"touchstart",
e=>{

dragging=true;

}
);

canvas.addEventListener(
"touchend",
e=>{

dragging=false;

}
);

canvas.addEventListener(
"touchmove",
e=>{

if(!dragging) return;

e.preventDefault();

const rect =
canvas.getBoundingClientRect();

const touch =
e.touches[0];

gridCenterX =
(
touch.clientX
-
rect.left
)
*
canvas.width
/
rect.width;

gridCenterY =
(
touch.clientY
-
rect.top
)
*
canvas.height
/
rect.height;

draw();

});

canvas.addEventListener(
"mousedown",
()=>{

dragging=true;

}
);

canvas.addEventListener(
"mouseup",
()=>{

dragging=false;

}
);

canvas.addEventListener(
"mousemove",
e=>{

if(!dragging) return;

const rect =
canvas.getBoundingClientRect();

gridCenterX =
(
e.clientX
-
rect.left
)
*
canvas.width
/
rect.width;

gridCenterY =
(
e.clientY
-
rect.top
)
*
canvas.height
/
rect.height;

draw();

});

draw();

</script>

</body>
</html>
